name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit / integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Optional: Google Drive sync backend (OAuth 2.0 Web client ID).
          # Configure it under Settings → Secrets and variables → Actions → Variables.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Optional: pre-fill the sync form with a default WebDAV endpoint.
          VITE_WEBDAV_URL: ${{ vars.VITE_WEBDAV_URL }}
          VITE_REMOTESTORAGE_ADDRESS: ${{ vars.VITE_REMOTESTORAGE_ADDRESS }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

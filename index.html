<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>词根词缀记忆工坊</title>
    <meta
      name="description"
      content="词根词缀记忆工坊：检索、拆解联想、闪卡训练、选择题巩固，支持 WebDAV / Google Drive 云同步。"
    />
    <meta name="theme-color" content="#f6f3ea" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"
    />
    <script>
      // Resolve the theme before the first paint to avoid a flash of the wrong
      // palette. Keep the key in sync with src/stores/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('cigen-theme-v1');
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0a1214' : '#f6f3ea');
          }
        } catch (error) {
          /* private mode: keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div class="bg bg-a"></div>
    <div class="bg bg-b"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
